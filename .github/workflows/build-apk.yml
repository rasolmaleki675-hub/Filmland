name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Filmland APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        id: build_apk
        continue-on-error: true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || (cat build.log && exit 1)

      - name: Show Failure Log if any
        if: steps.build_apk.outcome != 'success'
        run: |
          cat android/build.log | tail -n 50
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Filmland-App-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
